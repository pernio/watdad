plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def targetMinecraftVersion = project.minecraft_version.toString()
def versionedClientSourceDir

if (targetMinecraftVersion == "26.1") {
    versionedClientSourceDir = "src/client26_1/java"
} else if (targetMinecraftVersion == "26.2") {
    versionedClientSourceDir = "src/client26_2/java"
} else {
    throw new GradleException("Unsupported minecraft_version '${targetMinecraftVersion}'. Expected 26.1 or 26.2.")
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "watdad" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java.srcDir(versionedClientSourceDir)
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.3+4575b05f9e"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    include(implementation("org.yaml:snakeyaml:${project.snakeyaml_version}"))
}

processResources {
    def version = project.version
    def supportedMinecraftVersions = project.findProperty("supported_minecraft_versions_override")
            ?: project.supported_minecraft_versions
    inputs.property "version", version
    inputs.property "loader_version", project.loader_version
    inputs.property "supported_minecraft_versions", supportedMinecraftVersions

    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand(
                version: version,
                loader_version: project.loader_version,
                supported_minecraft_versions: supportedMinecraftVersions
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE.txt") {
        rename { "${it}_${projectName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
